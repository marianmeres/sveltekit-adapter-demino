# Each job runs `package.json` scripts only, so CI checks what `pnpm run ...`
# checks locally - nothing is defined only here.
#
# - Node is the dev runtime, the reference and the gate: `pnpm run ci` is the
#   typecheck (tsc --noEmit, the only type gate - the suite is type-stripped),
#   Biome, the suite (incl. the generated handler.js executed on demino), and
#   the npm smoke (build, pack, install, adapt + serve, consumer type check).
# - Deno is a consumer runtime of the generated handler.js while Deno-served
#   apps use it: the same suite on Deno, resolved through package.json +
#   node_modules (no deno.json). Pinned to the exact version used locally; the
#   runtime is in bug-fix-only mode, bump it deliberately.
# - Nothing runs on Bun.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7
      # pnpm version is read from package.json "packageManager"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  deno:
    name: Deno ${{ matrix.deno }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        deno: ["2.9.8"]
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}
      # pnpm installs node_modules, which Deno resolves the suite through
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:deno
